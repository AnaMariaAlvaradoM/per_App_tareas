<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17151a">
<meta name="description" content="Nova — escribe lo que traes en la cabeza y guárdalo en segundos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nova</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17151a; --bg-elevated:#1c1a22;
    --surface:#211e28; --surface-2:#2a2632;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
    --text:#f5f1fb; --text-dim:#c2b8d1; --text-faint:#8b8299;
    --accent:#a78bfa; --accent-bright:#c4b5fd;
    --accent-bg:rgba(167,139,250,.16); --accent-border:rgba(167,139,250,.4);
    --warn:#e0a12a; --warn-bg:rgba(224,161,42,.16);
    --danger:#ef7169; --danger-bg:rgba(239,113,105,.16);
    --success:#52c98a;
    --radius-lg:18px; --radius-md:12px;
    --font-serif:'Instrument Serif',serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.5;letter-spacing:-0.01em;
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:480px;min-height:100vh;
    display:flex;flex-direction:column;padding:0 16px 90px;}

  :focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px;border-radius:4px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* ── Cabecera fija: marca, nav y captura siempre a mano ── */
  .pinned{position:sticky;top:0;z-index:20;background:var(--bg);
    padding-top:24px;margin:0 -16px;padding-left:16px;padding-right:16px;
    border-bottom:1px solid var(--border);}

  /* El logotipo es la ÚNICA excepción tipográfica: todo lo demás usa Inter. */
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;}
  .brand h1{font-family:var(--font-serif);font-style:italic;font-weight:400;
    font-size:27px;color:var(--accent-bright);letter-spacing:-.2px;}
  .fecha{font-size:14px;color:var(--text-dim);text-transform:capitalize;}

  .views{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;
    scrollbar-width:none;}
  .views::-webkit-scrollbar{display:none;}
  .view-tab{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;
    min-height:40px;padding:0 14px;border:1px solid transparent;
    border-radius:999px;background:none;color:var(--text-dim);
    font:inherit;font-size:14px;font-weight:500;cursor:pointer;
    transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease);}
  .view-tab:hover{background:var(--surface);color:var(--text);}
  .view-tab:focus-visible{outline-offset:1px;}
  .view-tab[aria-current="page"]{background:var(--accent-bg);
    color:var(--accent-bright);border-color:var(--accent-border);font-weight:600;}
  .view-tab .count{font-size:13px;color:inherit;opacity:.8;}

  .capture{padding:18px 0 16px;}
  .capture-q{font-size:18px;font-weight:600;color:var(--text);
    margin-bottom:12px;letter-spacing:-.2px;}
  .field{display:flex;align-items:center;gap:10px;background:var(--surface-2);
    border:1px solid var(--border-strong);border-radius:var(--radius-md);
    padding:0 16px;min-height:52px;
    transition:border-color .15s var(--ease),box-shadow .15s var(--ease);}
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
  .field svg{width:19px;height:19px;color:var(--text-faint);flex-shrink:0;}
  #input{flex:1;background:none;border:none;outline:none;color:var(--text);
    font:inherit;font-size:16px;min-height:52px;}
  #input::placeholder{color:var(--text-faint);}
  .capture-hint{margin-top:10px;font-size:14px;color:var(--text-faint);}

  main{flex:1;}
  .view-section{margin-top:28px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:12px;padding:0 2px;}
  .section-head h2{font-size:13px;font-weight:600;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.5px;}

  /* ── Un solo panel por lista: nada de tarjeta-por-tarea ── */
  .list-panel{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);overflow:hidden;}
  .task-list{list-style:none;}

  .task{display:flex;align-items:flex-start;gap:6px;padding:12px 14px;
    border-bottom:1px solid var(--border);position:relative;
    transition:background .15s var(--ease);}
  .task:last-child{border-bottom:none;}
  .task:hover,.task:focus-within{background:var(--surface-2);}
  .task.dragging{opacity:.5;}
  .task.dragover{box-shadow:inset 0 2px 0 var(--accent);}
  .task.important{box-shadow:inset 3px 0 0 var(--accent);}
  .task.important:hover,.task.important:focus-within{
    box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 999px var(--surface-2);}

  .icon-btn{display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;flex-shrink:0;cursor:pointer;background:none;
    border:none;border-radius:999px;color:var(--text-dim);
    transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease);}
  .icon-btn svg{width:18px;height:18px;}

  .check-hit{width:44px;height:44px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;margin:-11px 0 -11px -10px;}
  .check{width:22px;height:22px;accent-color:var(--accent);cursor:pointer;}

  .star{color:var(--text-faint);}
  .star:hover{color:var(--accent);background:var(--surface-2);}
  .star.active{color:var(--accent-bright);}

  .body{flex:1;min-width:0;padding-top:11px;}
  .txt{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--text);font:inherit;font-size:16px;line-height:1.45;
    word-wrap:break-word;cursor:pointer;padding:0;}
  .task.done .txt{color:var(--text-dim);text-decoration:line-through;}

  .tag{display:inline-flex;align-items:center;gap:4px;margin-top:7px;
    font-size:14px;padding:2px 10px;border-radius:999px;
    color:var(--accent-bright);background:var(--accent-bg);}
  .tag svg{width:14px;height:14px;flex-shrink:0;}
  .tag.urgent{color:var(--warn);background:var(--warn-bg);}
  .tag.overdue{color:var(--danger);background:var(--danger-bg);}

  .edit-input{width:100%;background:var(--bg-elevated);border:1px solid var(--accent);
    border-radius:8px;padding:8px 10px;color:var(--text);
    font-family:inherit;font-size:16px;outline:none;}

  /* ── Acciones secundarias: visibles siempre para teclado, solo
     aparentes al enfocar o pasar el cursor ── */
  .actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;margin-left:-10px;
    opacity:0;pointer-events:none;transition:opacity .15s var(--ease);}
  .task:hover .actions,.task:focus-within .actions{opacity:1;pointer-events:auto;}
  .act{border:1px solid var(--border-strong);width:38px;height:38px;}
  .act:hover{border-color:var(--accent);color:var(--text);}
  .act.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg);}

  .empty{padding:44px 22px;text-align:center;}
  .empty .icon{width:28px;height:28px;color:var(--accent);opacity:.55;
    display:block;margin:0 auto 12px;}
  .empty h3{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .empty p{font-size:14px;color:var(--text-dim);line-height:1.55;
    max-width:320px;margin:0 auto 14px;}
  .empty button{min-height:40px;padding:0 18px;border-radius:999px;
    border:1px solid var(--border-strong);background:var(--surface-2);
    color:var(--accent-bright);font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  .empty button:hover{border-color:var(--accent);}

  .skeleton{padding:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);}
  .skel-line{height:14px;border-radius:6px;margin-bottom:12px;
    background:linear-gradient(90deg,var(--surface-2) 25%,var(--border-strong) 37%,var(--surface-2) 63%);
    background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
  .skel-line:last-child{margin-bottom:0;}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

  #toast{position:fixed;bottom:22px;left:50%;
    transform:translateX(-50%) translateY(90px);
    background:var(--surface);border:1px solid var(--border-strong);
    border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;
    font-size:14px;color:var(--text);transition:transform .2s var(--ease);z-index:50;
    box-shadow:0 12px 32px rgba(0,0,0,.45);max-width:calc(100% - 32px);}
  #toast.show{transform:translateX(-50%) translateY(0);}
  #toast button{min-height:36px;background:none;border:none;color:var(--accent-bright);
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;}

  @media (max-width:380px){
    .brand h1{font-size:24px;}
    .capture-q{font-size:16.5px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="pinned">
    <header class="brand">
      <h1>Nova</h1>
      <p class="fecha" id="fecha">cargando fecha…</p>
    </header>

    <nav class="views" aria-label="Vistas">
      <button type="button" class="view-tab" data-view="inbox" aria-current="page">
        Inbox <span class="count" id="count-inbox">–</span>
      </button>
      <button type="button" class="view-tab" data-view="today">
        Hoy <span class="count" id="count-today">–</span>
      </button>
      <button type="button" class="view-tab" data-view="upcoming">
        Próximas <span class="count" id="count-upcoming">–</span>
      </button>
      <button type="button" class="view-tab" data-view="completed">
        Completadas <span class="count" id="count-completed">–</span>
      </button>
    </nav>

    <section class="capture" aria-label="Capturar tarea">
      <h2 class="capture-q">¿Qué tienes en la cabeza?</h2>
      <form id="capture-form" autocomplete="off">
        <label for="input" class="sr-only">Escribe una tarea y presiona Enter</label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <input id="input" name="text" type="text"
                 placeholder="Escribe una tarea y presiona Enter…"
                 autocomplete="off" autocapitalize="sentences" enterkeyhint="done" autofocus>
        </div>
      </form>
      <p class="capture-hint">Ejemplo: «Preparar la clase mañana a las 9».</p>
    </section>
  </div>

  <main id="main" aria-label="Tareas"></main>

  <div id="toast" role="status" aria-live="polite">
    <span id="toast-txt"></span>
    <button type="button" id="undo" hidden>Deshacer</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const input = $("#input");
const main = $("#main");

let state = null;          // último snapshot del servidor
let activeView = "inbox";  // inbox | today | upcoming | completed
let hasData = false;       // true en cuanto /api/state respondió una vez con éxito
let editingId = null;
let pressTimer = null;
let dragId = null;
let lastDeleted = null;    // item completo, para poder deshacer el borrado
let toastTimer = null;

// ─── Íconos: SVG en línea, sin depender de ninguna CDN externa ─────────────

const ICON_PATHS = {
  notes: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
  calendar: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>',
  checks: '<path d="M2.5 12.5l3.5 3.5L13 8"/><path d="M9 13l3 3 8-9"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
  pencil: '<path d="M4 20l.9-4L15 5.9a1.5 1.5 0 0 1 2.1 0l1 1a1.5 1.5 0 0 1 0 2.1L8 19l-4 1Z"/><path d="M13.5 7.5l3 3"/>',
  flag: '<path d="M5 21V4"/><path d="M5 5h12l-2.5 3.5L17 12H5"/>',
  flagOff: '<path d="M5 21V4"/><path d="M5 5h12l-2.5 3.5L17 12H5"/><path d="M3 3l18 18"/>',
  trash: '<path d="M4 7h16"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9.5 7V4.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7"/><path d="M10 11v6M14 11v6"/>',
  star: '<path d="M12 3.5l2.6 5.6 6.1.6-4.6 4.1 1.4 6-5.5-3.2-5.5 3.2 1.4-6-4.6-4.1 6.1-.6Z"/>',
  starFilled: '<path d="M12 3.5l2.6 5.6 6.1.6-4.6 4.1 1.4 6-5.5-3.2-5.5 3.2 1.4-6-4.6-4.1 6.1-.6Z" fill="currentColor"/>',
};

function icon(name, extraClass){
  const inner = ICON_PATHS[name] || "";
  const cls = extraClass ? ` class="${extraClass}"` : "";
  return `<svg${cls} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ` +
    `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
}

const EMPTY_COPY = {
  inbox: ["Tu cabeza está libre por ahora",
    "Cuando recuerdes algo, escríbelo arriba. No tienes que organizarlo todavía.", "notes"],
  today: ["Todavía no elegiste tus prioridades",
    "Selecciona hasta cinco tareas que realmente quieras terminar hoy.", "target"],
  upcoming: ["Nada agendado todavía",
    "Cuando le pongas fecha a una tarea, aparecerá aquí.", "calendar"],
  completed: ["Aún no completas nada",
    "Lo que termines va a ir quedando aquí.", "checks"],
};
const VIEW_LABELS = {inbox: "Inbox", today: "Hoy", upcoming: "Próximas", completed: "Completadas"};

// ─── Carga de datos ────────────────────────────────────────────────────────
// Sin "aviso de conexión" global: si /api/state falla y ya teníamos datos,
// simplemente se mantiene la última lista buena en pantalla (no se borra
// nada) y se reintenta en el siguiente ciclo. Si una acción puntual falla,
// esa acción YA avisa con su propio toast ("No se pudo guardar", etc.),
// que es la información que de verdad importa en el momento.

async function load(){
  try{
    const r = await fetch("/api/state");
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    state = await r.json();
    hasData = true;
  }catch(err){
    console.warn("Nova: no se pudo refrescar el estado", err);
  }
  renderAll();
}

function renderAll(){
  renderTopbar();
  renderMain();
}

function renderTopbar(){
  document.querySelectorAll(".view-tab").forEach(btn=>{
    if(btn.dataset.view === activeView) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });
  if(!hasData) return;
  $("#fecha").textContent = state.greeting.fecha;
  $("#count-inbox").textContent = state.inbox.length;
  $("#count-today").textContent = state.today.length;
  $("#count-upcoming").textContent = state.upcoming.length;
  $("#count-completed").textContent = state.completed.length;
}

function renderMain(){
  if(!hasData){
    // Solo se ve si Nova NUNCA logró cargar datos: no hay nada que mostrar
    // todavía, así que sí amerita una pantalla dedicada con reintentar.
    main.innerHTML = `<div class="empty">${icon("alert", "icon")}
      <h3>No pudimos conectar con Nova</h3>
      <p>Revisa tu conexión e intenta de nuevo.</p>
      <button type="button" id="retry-empty">Reintentar</button></div>`;
    $("#retry-empty").addEventListener("click", load);
    return;
  }

  main.innerHTML = "";
  if(activeView === "inbox"){
    main.appendChild(buildSection("today", state.today));
    main.appendChild(buildSection("inbox", state.inbox));
  }else if(activeView === "today"){
    main.appendChild(buildSection("today", state.today));
  }else if(activeView === "upcoming"){
    main.appendChild(buildSection("upcoming", state.upcoming));
  }else if(activeView === "completed"){
    main.appendChild(buildSection("completed", state.completed));
  }
}

function buildSection(key, items){
  const section = document.createElement("section");
  section.className = "view-section";

  const head = document.createElement("div");
  head.className = "section-head";
  head.innerHTML = `<h2>${VIEW_LABELS[key]}</h2>`;
  section.appendChild(head);

  if(!items.length){
    section.appendChild(emptyState(key));
    return section;
  }

  const panel = document.createElement("div");
  panel.className = "list-panel";
  const ul = document.createElement("ul");
  ul.className = "task-list";
  for(const it of items) ul.appendChild(renderTask(it, key));
  panel.appendChild(ul);
  section.appendChild(panel);
  return section;
}

function emptyState(key){
  const [title, text, iconName] = EMPTY_COPY[key];
  const div = document.createElement("div");
  div.className = "empty";
  div.innerHTML = `${icon(iconName, "icon")}<h3>${title}</h3><p>${text}</p>`;
  return div;
}

// ─── Fila de tarea ─────────────────────────────────────────────────────────

function renderTask(it, view){
  const li = document.createElement("li");
  li.className = "task" + (it.done ? " done" : "") + (it.important ? " important" : "");
  li.dataset.id = it.id;

  const canDrag = !it.done && (view === "inbox" || view === "today");
  if(canDrag) li.draggable = true;

  const checkWrap = document.createElement("div");
  checkWrap.className = "check-hit";
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.className = "check";
  checkbox.id = `chk-${it.id}`;
  checkbox.checked = it.done;
  checkbox.setAttribute("aria-label", `Marcar "${it.text}" como completada`);
  checkbox.addEventListener("change", () => toggleDone(it.id));
  checkWrap.appendChild(checkbox);

  const star = document.createElement("button");
  star.type = "button";
  star.className = "icon-btn star" + (it.important ? " active" : "");
  star.setAttribute("aria-pressed", it.important ? "true" : "false");
  star.setAttribute("aria-label", it.important ? "Quitar de importantes" : "Marcar como importante");
  star.title = star.getAttribute("aria-label");
  star.innerHTML = icon(it.important ? "starFilled" : "star");
  star.addEventListener("click", () => toggleImportant(it.id));

  const body = document.createElement("div");
  body.className = "body";

  const txt = document.createElement("button");
  txt.type = "button";
  txt.className = "txt";
  txt.textContent = it.text;
  txt.title = "Doble clic, o Enter con el teclado, para editar";
  txt.addEventListener("dblclick", () => startEdit(it));
  txt.addEventListener("click", e => { if(e.detail === 0) startEdit(it); });
  body.appendChild(txt);

  if(it.due_label){
    const tag = document.createElement("span");
    const cls = it.due_label === "vencida" ? " overdue" : (it.urgent ? " urgent" : "");
    tag.className = "tag" + cls;
    tag.innerHTML = `${icon("calendar")}${it.due_label}`;
    body.appendChild(tag);
  }

  body.appendChild(buildActions(it, view));
  li.append(checkWrap, star, body);

  if(canDrag){
    const start = () => { pressTimer = setTimeout(() => startEdit(it), 500); };
    const cancel = () => clearTimeout(pressTimer);
    li.addEventListener("touchstart", start, {passive: true});
    li.addEventListener("touchend", cancel);
    li.addEventListener("touchmove", cancel);

    li.addEventListener("dragstart", () => { dragId = it.id; li.classList.add("dragging"); });
    li.addEventListener("dragend", () => { li.classList.remove("dragging"); saveOrder(li.closest(".task-list")); });
    li.addEventListener("dragover", e => {
      e.preventDefault();
      const list = li.closest(".task-list");
      const dragging = list.querySelector(".dragging");
      if(dragging && dragging !== li){
        const rect = li.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        list.insertBefore(dragging, after ? li.nextSibling : li);
      }
    });
  }

  return li;
}

function buildActions(it, view){
  const wrap = document.createElement("div");
  wrap.className = "actions";

  wrap.appendChild(actionButton("pencil", "Editar tarea", () => startEdit(it)));

  if(!it.done){
    if(it.today){
      wrap.appendChild(actionButton("flagOff", "Quitar de Hoy", () => toggleToday(it.id)));
    }else{
      wrap.appendChild(actionButton("flag", "Mover a Hoy", () => toggleToday(it.id)));
    }
    wrap.appendChild(actionButton("calendar", it.due ? "Quitar fecha" : "Poner fecha: mañana",
      () => cycleDate(it)));
  }

  const del = actionButton("trash", "Eliminar tarea", () => removeItem(it));
  del.classList.add("danger");
  wrap.appendChild(del);

  return wrap;
}

function actionButton(iconName, label, handler){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "icon-btn act";
  b.setAttribute("aria-label", label);
  b.title = label;
  b.innerHTML = icon(iconName);
  b.addEventListener("click", handler);
  return b;
}

// ─── Edición en línea ──────────────────────────────────────────────────────

function startEdit(it){
  if(editingId !== null) return;
  editingId = it.id;
  const li = document.querySelector(`.task[data-id="${it.id}"]`);
  if(!li){ editingId = null; return; }
  const body = li.querySelector(".body");
  body.innerHTML = "";
  const inp = document.createElement("input");
  inp.className = "edit-input";
  inp.value = it.text;
  inp.setAttribute("aria-label", "Editar tarea");
  body.appendChild(inp);
  inp.focus();
  inp.setSelectionRange(inp.value.length, inp.value.length);

  let done = false;
  const finish = async (commit) => {
    if(done) return;
    done = true;
    const v = inp.value.trim();
    editingId = null;
    if(commit && v && v !== it.text){
      try{
        const r = await fetch(`/api/edit/${it.id}`, {method: "POST",
          headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: v})});
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
      }catch(e){ showToast("No se pudo guardar la edición."); }
    }
    load();
  };
  inp.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); finish(true); }
    if(e.key === "Escape"){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener("blur", () => finish(true));
}

// ─── Acciones ──────────────────────────────────────────────────────────────
// Cada acción revisa r.ok (no solo si el fetch se ejecutó) y avisa con un
// toast si algo salió mal, en vez de fallar en silencio.

async function addItem(text){
  try{
    const r = await fetch("/api/add", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const item = await r.json();
    if(item.capped) showToast("Hoy ya tenía 5 prioridades: la guardé en Inbox.");
  }catch(e){
    showToast("No se pudo guardar. Intenta de nuevo.");
  }
  await load();
}

async function toggleDone(id){
  try{
    const r = await fetch(`/api/toggle/${id}`, {method: "POST"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
  }catch(e){ showToast("No se pudo actualizar la tarea."); }
  await load();
}

async function toggleImportant(id){
  try{
    const r = await fetch(`/api/important/${id}`, {method: "POST"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
  }catch(e){ showToast("No se pudo actualizar la tarea."); }
  await load();
}

async function toggleToday(id){
  try{
    const r = await fetch(`/api/today/${id}`, {method: "POST"});
    if(r.status === 409){
      const limit = (state && state.today_limit) || 5;
      showToast(`Hoy ya tiene ${limit} prioridades. Termina o quita una para agregar otra.`);
      return;
    }
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
  }catch(e){ showToast("No se pudo mover la tarea."); }
  await load();
}

async function cycleDate(it){
  const when = it.due ? "clear" : "tomorrow";
  try{
    const r = await fetch(`/api/due/${it.id}`, {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({when})});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
  }catch(e){ showToast("No se pudo cambiar la fecha."); }
  await load();
}

async function removeItem(it){
  lastDeleted = {text: it.text, due: it.due, today: it.today, important: it.important};
  try{
    const r = await fetch(`/api/item/${it.id}`, {method: "DELETE"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    showToast("Tarea eliminada", true);
  }catch(e){
    showToast("No se pudo eliminar la tarea.");
  }
  await load();
}

async function saveOrder(ul){
  if(!ul) return;
  const ids = [...ul.querySelectorAll("li")].map(li => parseInt(li.dataset.id, 10));
  try{
    await fetch("/api/reorder", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({ids})});
  }catch(e){ /* el orden visual ya quedó bien; se reintentará al refrescar */ }
  await load();
}

function showToast(msg, withUndo = false){
  $("#toast-txt").textContent = msg;
  $("#undo").hidden = !withUndo;
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 5000);
}

$("#undo").addEventListener("click", async () => {
  if(!lastDeleted) return;
  try{
    await fetch("/api/add", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(lastDeleted)});
  }catch(e){ /* si falla, simplemente no se restaura */ }
  lastDeleted = null;
  $("#toast").classList.remove("show");
  await load();
});

// ─── Captura y navegación ──────────────────────────────────────────────────

$("#capture-form").addEventListener("submit", async e => {
  e.preventDefault();
  const v = input.value.trim();
  if(!v) return;
  input.value = "";
  await addItem(v);
  input.focus();
});

document.querySelectorAll(".view-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    activeView = btn.dataset.view;
    renderAll();
  });
});

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}

load();
setInterval(() => { if(editingId === null) load(); }, 60000);
</script>
