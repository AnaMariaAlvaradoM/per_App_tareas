<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:           #0c0c0f;
  --surface:      #141417;
  --surface2:     #1c1c21;
  --surface3:     #222228;
  --border:       #2a2a32;
  --border2:      #333340;
  --accent:       #7eb8f7;
  --accent2:      #5ba3f0;
  --accent-dim:   rgba(91,163,240,0.10);
  --accent-glow:  rgba(91,163,240,0.06);
  --text:         #eeeef2;
  --text-sub:     #8f8fa0;
  --text-dim:     #52525f;
  --today:        #ff7055;
  --today-soft:   rgba(255,112,85,0.10);
  --today-badge:  rgba(255,112,85,0.18);
  --week-badge:   rgba(255,255,255,0.06);
  --done-bg:      rgba(255,255,255,0.02);
  --danger:       #f05252;
  --danger-bg:    rgba(240,82,82,0.10);
  --cat-trabajo:  #7eb8f7;
  --cat-personal: #a78bfa;
  --cat-salud:    #34d399;
  --cat-casa:     #fbbf24;
  --cat-otro:     #f87171;
  --cat-general:  #52525f;
  --green:        #34d399;
  --green-bg:     rgba(52,211,153,0.10);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 16px;
}

/* Ambient glow */
body::before {
  content:'';
  position:fixed; top:-10%; left:50%; transform:translateX(-50%);
  width:700px; height:500px;
  background: radial-gradient(ellipse at center, rgba(91,163,240,0.04) 0%, transparent 65%);
  pointer-events:none; z-index:0;
}

/* ════════════════════════════════════════
   APP SHELL
════════════════════════════════════════ */
.app {
  width:100%; max-width:1040px; height:93vh; max-height:860px;
  display:flex;
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  background:var(--bg);
  box-shadow: 0 32px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03);
  position:relative; z-index:1;
  margin:0 16px;
}

/* ════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════ */
.sidebar {
  width:280px; flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* — Header — */
.sidebar-header {
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.logo-row {
  display:flex; align-items:center; gap:10px;
  margin-bottom:18px;
}
.logo {
  width:32px; height:32px; border-radius:9px;
  background:var(--accent2);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; color:#0c0c0f;
  flex-shrink:0;
  box-shadow: 0 2px 12px rgba(91,163,240,0.3);
}
.logo-name {
  font-size:17px; font-weight:600; letter-spacing:-0.3px;
  font-family:'Instrument Serif', serif; font-style:italic;
}
.dot-live {
  width:6px; height:6px; border-radius:50%;
  background:var(--green); margin-left:auto;
  box-shadow:0 0 6px var(--green);
  animation:blink 2.5s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* — Progress ring — */
.progress-row {
  display:flex; align-items:center; gap:14px;
}
.ring-wrap { position:relative; width:44px; height:44px; flex-shrink:0; }
.ring-wrap svg { width:44px; height:44px; transform:rotate(-90deg); }
.ring-bg  { fill:none; stroke:var(--surface2); stroke-width:3; }
.ring-fill {
  fill:none; stroke:var(--accent2); stroke-width:3;
  stroke-linecap:round; stroke-dasharray:113.1; stroke-dashoffset:113.1;
  transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1);
}
.ring-num {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:600; color:var(--accent);
  font-family:'JetBrains Mono',monospace;
}
.progress-meta { flex:1; min-width:0; }
.progress-label { font-size:11px; color:var(--text-dim); margin-bottom:2px; letter-spacing:0.02em; }
.progress-count { font-size:22px; font-weight:700; letter-spacing:-0.8px; line-height:1; }
.progress-count span { font-size:13px; font-weight:400; color:var(--text-dim); }

/* — Carga del día — */
.load-bar-wrap {
  padding:12px 18px 10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.load-label {
  font-size:11px; color:var(--text-dim); letter-spacing:0.05em; text-transform:uppercase;
  font-weight:600; margin-bottom:7px; display:flex; align-items:center; justify-content:space-between;
}
.load-label span { font-size:12px; color:var(--text-sub); text-transform:none; letter-spacing:0; font-weight:500; }
.load-bar-bg {
  height:4px; background:var(--surface2); border-radius:99px; overflow:hidden;
}
.load-bar-fill {
  height:100%; border-radius:99px;
  background:linear-gradient(90deg, var(--accent2), var(--accent));
  transition:width .6s cubic-bezier(.4,0,.2,1);
  width:0%;
}
.load-bar-fill.overload { background:linear-gradient(90deg, var(--today), #ff4444); }

/* — Add task — */
.add-task-area {
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.add-row1 {
  display:flex; gap:6px; align-items:center; margin-bottom:6px;
}
.add-input {
  flex:1; background:var(--surface2); border:1px solid var(--border);
  border-radius:9px; padding:8px 11px;
  color:var(--text); font-family:'Instrument Sans',sans-serif; font-size:14px;
  outline:none; transition:border-color .15s, box-shadow .15s;
}
.add-input:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(91,163,240,0.08); }
.add-input::placeholder { color:var(--text-dim); }
.add-confirm {
  width:32px; height:32px; border-radius:9px;
  background:var(--accent2); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .15s;
  box-shadow:0 2px 8px rgba(91,163,240,0.25);
}
.add-confirm:hover { background:var(--accent); transform:scale(1.05); }
.add-confirm svg { width:13px; height:13px; fill:#0c0c0f; }

.add-row2 {
  display:flex; gap:5px; align-items:center;
}
.pri-toggle {
  display:flex; border-radius:7px; overflow:hidden;
  border:1px solid var(--border); flex-shrink:0;
}
.pt-btn {
  padding:5px 9px; font-size:10px; font-weight:700; letter-spacing:0.04em;
  border:none; cursor:pointer; transition:all .15s;
  font-family:'Instrument Sans',sans-serif; background:transparent; color:var(--text-dim);
}
.pt-btn.today.active { background:var(--today-badge); color:var(--today); }
.pt-btn.week.active  { background:var(--week-badge); color:var(--text-sub); }

.cat-select {
  flex:1; background:var(--surface2); border:1px solid var(--border);
  border-radius:7px; padding:5px 8px;
  color:var(--text-sub); font-family:'Instrument Sans',sans-serif; font-size:11px;
  outline:none; cursor:pointer; appearance:none;
  transition:border-color .15s;
}
.cat-select:focus { border-color:var(--accent2); }
option { background:var(--surface2); }

/* — Undo toast — */
.undo-toast {
  display:none; align-items:center; gap:8px;
  margin:0 12px 4px; padding:8px 12px;
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:10px; font-size:13px; color:var(--text-sub);
  animation:slideUp .2s ease;
  flex-shrink:0;
}
.undo-toast.show { display:flex; }
@keyframes slideUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.undo-toast span { flex:1; }
.undo-btn {
  background:none; border:none; color:var(--accent); cursor:pointer;
  font-size:12px; font-weight:600; font-family:'Instrument Sans',sans-serif;
  padding:2px 7px; border-radius:5px; transition:background .15s;
}
.undo-btn:hover { background:var(--accent-dim); }

/* — Task list — */
.task-list {
  flex:1; overflow-y:auto; padding:4px 0 8px;
}
.task-list::-webkit-scrollbar { width:2px; }
.task-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }

.section-label {
  font-size:10px; font-weight:700; letter-spacing:0.8px;
  color:var(--text-dim); text-transform:uppercase;
  padding:10px 18px 4px; flex-shrink:0;
}

.task-row {
  display:flex; align-items:flex-start; gap:9px;
  padding:9px 10px 9px 16px;
  transition:background .1s;
  position:relative; cursor:default;
}
.task-row:hover { background:var(--surface2); }
.task-row.done { opacity:0.3; background:var(--done-bg); }
.task-row.priority-today:not(.done) { background:var(--today-soft); }
.task-row.priority-today:not(.done):hover { background:rgba(255,112,85,0.14); }

.t-dot {
  width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:5px;
}
.priority-today:not(.done) .t-dot { background:var(--today); box-shadow:0 0 5px rgba(255,112,85,0.5); }
.priority-week:not(.done) .t-dot { background:var(--border2); }
.done .t-dot { background:var(--text-dim); }

.t-content { flex:1; min-width:0; }
.t-name {
  font-size:14px; line-height:1.4; color:var(--text);
  word-break:break-word; margin-bottom:3px;
}
.task-row.done .t-name { text-decoration:line-through; color:var(--text-dim); }

.t-meta {
  display:flex; align-items:center; gap:5px; flex-wrap:wrap;
}
.cat-chip {
  font-size:10px; font-weight:600; letter-spacing:0.03em;
  padding:2px 6px; border-radius:4px;
  border:none; background:rgba(255,255,255,0.05); color:var(--text-dim);
}
.cat-chip.trabajo  { color:var(--cat-trabajo);  background:rgba(126,184,247,0.10); }
.cat-chip.personal { color:var(--cat-personal); background:rgba(167,139,250,0.10); }
.cat-chip.salud    { color:var(--cat-salud);    background:rgba(52,211,153,0.10); }
.cat-chip.casa     { color:var(--cat-casa);     background:rgba(251,191,36,0.10); }
.cat-chip.otro     { color:var(--cat-otro);     background:rgba(248,113,113,0.10); }

.t-est {
  font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;
  display:flex; align-items:center; gap:3px;
}
.t-deadline {
  font-size:10px; color:var(--today); font-weight:500;
}

.pri-badge {
  font-size:9px; font-weight:700; letter-spacing:0.05em;
  padding:2px 6px; border-radius:4px; flex-shrink:0;
  cursor:pointer; transition:all .15s; border:none;
  font-family:'Instrument Sans',sans-serif; margin-top:2px;
}
.pri-badge.today { color:var(--today); background:var(--today-badge); }
.pri-badge.week  { color:var(--text-dim); background:var(--week-badge); }
.pri-badge:hover { opacity:0.7; }
.task-row.done .pri-badge { display:none; }

.task-actions {
  display:flex; gap:3px; flex-shrink:0; opacity:0;
  transition:opacity .15s; padding-top:1px;
}
.task-row:hover .task-actions { opacity:1; }

.t-btn {
  width:27px; height:27px; border-radius:7px; border:none;
  background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s; color:var(--text-dim);
}
.t-btn.check:hover { background:var(--green-bg); color:var(--green); }
.t-btn.del:hover   { background:var(--danger-bg); color:var(--danger); }
.t-btn svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.task-row.done .t-btn.check { display:none; }

.no-tasks {
  padding:20px 18px; font-size:14px; color:var(--text-dim); line-height:1.7;
}

/* — Footer sidebar — */
.sidebar-footer {
  padding:8px 12px; border-top:1px solid var(--border);
  display:flex; gap:6px; flex-shrink:0;
}
.footer-btn {
  flex:1; padding:7px 8px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface2);
  color:var(--text-dim); font-family:'Instrument Sans',sans-serif;
  font-size:11px; font-weight:500; cursor:pointer; transition:all .15s; text-align:center;
}
.footer-btn:hover { border-color:var(--danger); color:var(--danger); background:var(--danger-bg); }

/* ════════════════════════════════════════
   MAIN PANEL
════════════════════════════════════════ */
.main { flex:1; display:flex; flex-direction:column; min-width:0; }

.topbar {
  padding:15px 24px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; flex-shrink:0;
}
.topbar-label { font-size:14px; color:var(--text-sub); font-weight:400; }
.topbar-date {
  margin-left:auto; font-size:11px; color:var(--text-dim);
  font-family:'JetBrains Mono',monospace; letter-spacing:0.02em;
}
.mob-menu { display:none; }

/* — Messages — */
.messages {
  flex:1; overflow-y:auto; padding:24px;
  display:flex; flex-direction:column; gap:20px;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar { width:3px; }
.messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }

.message { display:flex; gap:11px; animation:fadeUp .22s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
.message.user { flex-direction:row-reverse; }

.msg-av {
  width:30px; height:30px; border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; margin-top:1px;
}
.msg-av.ai { background:var(--accent2); color:#0c0c0f; box-shadow:0 2px 8px rgba(91,163,240,0.3); }
.msg-av.me { background:var(--surface2); border:1px solid var(--border2); color:var(--text-sub); font-size:11px; }

.msg-body { display:flex; flex-direction:column; gap:4px; max-width:78%; }
.message.user .msg-body { align-items:flex-end; }
.msg-who { font-size:11px; color:var(--text-dim); padding:0 3px; font-weight:600; letter-spacing:0.02em; }

.msg-bubble {
  padding:13px 17px; border-radius:16px;
  font-size:15px; line-height:1.7; word-break:break-word;
}
.message.ai   .msg-bubble { background:var(--surface); border:1px solid var(--border); border-top-left-radius:4px; }
.message.user .msg-bubble { background:var(--surface2); border:1px solid var(--border2); border-top-right-radius:4px; }

/* Check-in especial */
.checkin-bubble {
  background: linear-gradient(135deg, rgba(91,163,240,0.08) 0%, rgba(91,163,240,0.03) 100%);
  border:1px solid rgba(91,163,240,0.2);
  border-top-left-radius:4px;
}

.action-tag {
  display:inline-flex; align-items:center; gap:5px;
  background:var(--accent-dim); border:1px solid rgba(91,163,240,0.15);
  color:var(--accent); font-size:10px; font-family:'JetBrains Mono',monospace;
  padding:3px 10px; border-radius:20px; margin-top:4px;
}

.typing-dots {
  display:flex; gap:5px; padding:14px 17px; align-items:center;
}
.t-dot-a {
  width:5px; height:5px; border-radius:50%; background:var(--text-dim);
  animation:tdot 1.3s ease-in-out infinite;
}
.t-dot-a:nth-child(2){animation-delay:.2s}
.t-dot-a:nth-child(3){animation-delay:.4s}
@keyframes tdot { 0%,60%,100%{transform:translateY(0);opacity:.3} 30%{transform:translateY(-6px);opacity:1} }

/* — Welcome / Check-in screen — */
.welcome {
  margin:auto; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  max-width:380px; padding:24px;
}
.w-icon {
  width:56px; height:56px; border-radius:16px; background:var(--accent2);
  display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:700; color:#0c0c0f;
  font-family:'Instrument Serif',serif; font-style:italic;
  box-shadow:0 0 50px rgba(91,163,240,0.25);
}
.welcome h2 { font-size:23px; font-weight:600; letter-spacing:-0.4px; }
.welcome p { font-size:15px; color:var(--text-sub); line-height:1.75; }
.sugs {
  display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:4px;
}
.sug {
  padding:7px 14px; background:var(--surface); border:1px solid var(--border);
  border-radius:20px; font-size:13px; color:var(--text-sub);
  cursor:pointer; transition:all .15s;
}
.sug:hover { border-color:var(--accent2); color:var(--accent); background:var(--accent-glow); }

.checkin-loading {
  margin:auto; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px;
}
.checkin-loading p { font-size:14px; color:var(--text-dim); }

/* — Input area — */
.input-area {
  padding:12px 24px 18px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.input-box {
  display:flex; gap:8px; align-items:flex-end;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:14px; padding:10px 12px;
  transition:border-color .2s, box-shadow .2s;
}
.input-box:focus-within { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(91,163,240,0.08); }
#msgInput {
  flex:1; background:none; border:none; outline:none;
  color:var(--text); font-family:'Instrument Sans',sans-serif;
  font-size:15px; resize:none; max-height:120px; line-height:1.55; padding:1px 0;
}
#msgInput::placeholder { color:var(--text-dim); }
.btns { display:flex; gap:7px; align-items:center; flex-shrink:0; }

.send-btn {
  width:34px; height:34px; border-radius:9px; background:var(--accent2); border:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .15s; flex-shrink:0;
  box-shadow:0 2px 12px rgba(91,163,240,0.3);
}
.send-btn:hover { background:var(--accent); transform:scale(1.05); }
.send-btn:active { transform:scale(.93); }
.send-btn:disabled { opacity:.3; cursor:not-allowed; box-shadow:none; transform:none; }
.send-btn svg { width:14px; height:14px; fill:#0c0c0f; }
.input-hint {
  font-size:10px; color:var(--text-dim); margin-top:7px; text-align:center;
  letter-spacing:0.02em;
}

/* ════════════════════════════════════════
   MOBILE
════════════════════════════════════════ */
@media (max-width:700px) {
  body { align-items:flex-start; }
  .app { margin:0; max-width:100%; height:100vh; max-height:100vh; border-radius:0; border:none; }
  .sidebar {
    display:none; position:fixed; inset:0; width:290px; z-index:100;
    border-radius:0 18px 18px 0; box-shadow:4px 0 40px rgba(0,0,0,0.6);
  }
  .sidebar.open { display:flex; }
  .mob-menu {
    display:flex; align-items:center; gap:7px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:6px 11px; font-size:12px; color:var(--text-sub);
    cursor:pointer; margin-right:10px;
    font-family:'Instrument Sans',sans-serif; font-weight:500;
  }
  .mob-menu:hover { border-color:var(--accent2); color:var(--text); }
  .topbar-date { display:none; }
  .messages { padding:16px; }
  .input-area { padding:10px 16px 16px; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <div class="logo-row">
        <div class="logo">N</div>
        <span class="logo-name">Nova</span>
        <span class="dot-live"></span>
      </div>
      <div class="progress-row">
        <div class="ring-wrap">
          <svg viewBox="0 0 44 44">
            <circle class="ring-bg"   cx="22" cy="22" r="18"/>
            <circle class="ring-fill" id="ringFill" cx="22" cy="22" r="18"/>
          </svg>
          <div class="ring-num" id="ringNum">0%</div>
        </div>
        <div class="progress-meta">
          <div class="progress-label">Completadas</div>
          <div class="progress-count" id="progCount">0 <span>/ 0</span></div>
        </div>
      </div>
    </div>

    <!-- Barra de carga del día -->
    <div class="load-bar-wrap">
      <div class="load-label">
        Carga HOY
        <span id="loadLabel">–</span>
      </div>
      <div class="load-bar-bg">
        <div class="load-bar-fill" id="loadBarFill"></div>
      </div>
    </div>

    <!-- Add task -->
    <div class="add-task-area">
      <div class="add-row1">
        <input class="add-input" id="addTaskInput" placeholder="Nueva tarea…" autocomplete="off"/>
        <button class="add-confirm" onclick="addTaskInline()" title="Agregar">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="add-row2">
        <div class="pri-toggle">
          <button class="pt-btn today active" id="aptToday" onclick="setAddPriority('today')">HOY</button>
          <button class="pt-btn week"         id="aptWeek"  onclick="setAddPriority('week')">SEM</button>
        </div>
        <select class="cat-select" id="addCatSelect">
          <option value="general">Sin categoría</option>
          <option value="trabajo">💼 Trabajo</option>
          <option value="personal">✨ Personal</option>
          <option value="salud">💚 Salud</option>
          <option value="casa">🏠 Casa</option>
          <option value="otro">📌 Otro</option>
        </select>
      </div>
    </div>

    <!-- Undo toast -->
    <div class="undo-toast" id="undoToast">
      <span id="undoMsg">Acción realizada</span>
      <button class="undo-btn" onclick="undoLast()">Deshacer</button>
    </div>

    <div class="task-list" id="taskList">
      <div class="no-tasks">Agrega una tarea arriba o dile a Nova</div>
    </div>

    <div class="sidebar-footer">
      <button class="footer-btn" onclick="clearDone()">Limpiar hechas</button>
      <button class="footer-btn" onclick="clearAll()">Borrar todo</button>
    </div>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="main">
    <div class="topbar">
      <button class="mob-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        Tareas
      </button>
      <span class="topbar-label">Asistente personal</span>
      <span class="topbar-date" id="topDate"></span>
    </div>

    <div class="messages" id="messages">
      <!-- Check-in loading state -->
      <div class="checkin-loading" id="checkinLoading">
        <div class="typing-dots">
          <div class="t-dot-a"></div><div class="t-dot-a"></div><div class="t-dot-a"></div>
        </div>
        <p>Nova está preparando tu día…</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="msgInput" placeholder="Cuéntale a Nova…" rows="1"></textarea>
        <div class="btns">
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
      <div class="input-hint">Enter para enviar · Shift+Enter para nueva línea</div>
    </div>
  </main>
</div>

<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
var hist        = [];
var isLoading   = false;
var addPriority = 'today';
var undoStack   = [];
var undoTimer   = null;
var checkinDone = false;

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
var DAYS   = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
              'septiembre','octubre','noviembre','diciembre'];
var nd = new Date();
document.getElementById('topDate').textContent =
  DAYS[nd.getDay()] + ', ' + nd.getDate() + ' de ' + MONTHS[nd.getMonth()];

// ════════════════════════════════════════
// ADD TASK INLINE
// ════════════════════════════════════════
function setAddPriority(p) {
  addPriority = p;
  document.getElementById('aptToday').classList.toggle('active', p==='today');
  document.getElementById('aptWeek').classList.toggle('active',  p==='week');
}

async function addTaskInline() {
  var inp  = document.getElementById('addTaskInput');
  var name = inp.value.trim();
  if (!name) return;
  var cat  = document.getElementById('addCatSelect').value;
  inp.value = '';
  var r = await fetch('/api/tasks', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:name, priority:addPriority, category:cat})
  });
  var d = await r.json();
  if (d.id) showUndo('Tarea agregada', {type:'delete', snapshot:{name:name, priority:addPriority, category:cat}});
  if (d.tasks) updateUI(d.tasks, d.progress, d.today_load);
}

document.getElementById('addTaskInput').addEventListener('keydown', function(e){
  if (e.key==='Enter') { e.preventDefault(); addTaskInline(); }
});

// ════════════════════════════════════════
// UNDO
// ════════════════════════════════════════
function showUndo(msg, action) {
  undoStack.push(action);
  document.getElementById('undoMsg').textContent = msg;
  var toast = document.getElementById('undoToast');
  toast.classList.add('show');
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(function(){
    toast.classList.remove('show');
    undoStack = [];
  }, 5000);
}

async function undoLast() {
  if (!undoStack.length) return;
  var action = undoStack.pop();
  document.getElementById('undoToast').classList.remove('show');
  if (undoTimer) clearTimeout(undoTimer);
  if (action.type==='delete' && action.snapshot) {
    await fetch('/api/tasks', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:action.snapshot.name, priority:action.snapshot.priority, category:action.snapshot.category||'general'})
    });
  } else if (action.type==='complete') {
    await fetch('/api/tasks/'+action.id+'/uncomplete', {method:'POST'});
  } else if (action.type==='priority') {
    await fetch('/api/tasks/'+action.id+'/priority', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({priority:action.oldPriority})
    });
  }
  loadTasks();
}

// ════════════════════════════════════════
// TASK ACTIONS
// ════════════════════════════════════════
async function completeTask(id) {
  showUndo('Tarea completada ✓', {type:'complete', id:id});
  var r = await fetch('/api/tasks/'+id+'/complete', {method:'POST'});
  var d = await r.json();
  if (d.tasks) updateUI(d.tasks, d.progress, d.today_load);
}

async function delTask(id, name, priority, cat) {
  showUndo('Tarea eliminada', {type:'delete', snapshot:{name:name, priority:priority, category:cat}});
  var r = await fetch('/api/tasks/'+id+'/delete', {method:'POST'});
  var d = await r.json();
  if (d.tasks) updateUI(d.tasks, d.progress, d.today_load);
}

async function togglePriority(id, currentPriority) {
  var newPri = currentPriority==='today' ? 'week' : 'today';
  showUndo('Prioridad cambiada', {type:'priority', id:id, oldPriority:currentPriority});
  var r = await fetch('/api/tasks/'+id+'/priority', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({priority:newPri})
  });
  var d = await r.json();
  if (d.tasks) updateUI(d.tasks, d.progress, d.today_load);
}

async function clearDone() {
  var r = await fetch('/api/tasks/clear-done', {method:'POST'});
  var d = await r.json();
  if (d.tasks) updateUI(d.tasks, d.progress, d.today_load);
}

async function clearAll() {
  if (!confirm('¿Borrar TODAS las tareas?')) return;
  var r = await fetch('/api/tasks/clear-all', {method:'POST'});
  var d = await r.json();
  if (d.tasks) updateUI(d.tasks, d.progress, d.today_load);
}

async function loadTasks() {
  try {
    var r = await fetch('/api/tasks');
    var d = await r.json();
    updateUI(d.tasks, d.progress, d.today_load);
  } catch(e){}
}

// ════════════════════════════════════════
// UPDATE UI — SIDEBAR
// ════════════════════════════════════════
function minsToHuman(m) {
  if (!m) return '';
  if (m < 60) return m+'min';
  var h = Math.floor(m/60), r = m%60;
  return h+'h'+(r ? ' '+r+'min' : '');
}

function updateUI(tasks, prog, todayLoad) {
  // Progress ring
  var pct   = (prog && prog.pct)   || 0;
  var done  = (prog && prog.done)  || 0;
  var total = (prog && prog.total) || 0;
  var circ  = 2 * Math.PI * 18; // r=18
  document.getElementById('ringFill').style.strokeDasharray  = circ;
  document.getElementById('ringFill').style.strokeDashoffset = circ - (pct/100)*circ;
  document.getElementById('ringNum').textContent  = pct+'%';
  document.getElementById('progCount').innerHTML  = done+' <span>/ '+total+'</span>';

  // Load bar
  if (todayLoad) {
    var mins    = todayLoad.minutes || 0;
    var count   = todayLoad.count   || 0;
    var maxMins = 480; // 8h = 100%
    var pctLoad = Math.min(Math.round((mins/maxMins)*100), 100);
    var fill    = document.getElementById('loadBarFill');
    fill.style.width = pctLoad+'%';
    fill.classList.toggle('overload', mins > 360); // >6h = rojo
    var human = minsToHuman(mins);
    document.getElementById('loadLabel').textContent =
      count > 0 ? (count+' tarea'+(count>1?'s':'')+(human ? ' · ~'+human : '')) : 'Sin tareas';
  }

  // Task list
  var el = document.getElementById('taskList');
  if (!tasks || !tasks.length) {
    el.innerHTML = '<div class="no-tasks">Sin tareas aún. Agrega una arriba o dile a Nova.</div>';
    return;
  }

  var pending = tasks.filter(function(t){ return !t.done; });
  var dones   = tasks.filter(function(t){ return t.done; });

  pending.sort(function(a,b){
    if (a.priority==='today' && b.priority!=='today') return -1;
    if (a.priority!=='today' && b.priority==='today') return 1;
    return 0;
  });

  var checkIcon = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  var trashIcon = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>';

  var h = '';

  function renderTask(t, isDone) {
    var isToday  = t.priority==='today';
    var priClass = isToday ? 'priority-today' : 'priority-week';
    var badgeCls = isToday ? 'today' : 'week';
    var badgeTxt = isToday ? 'HOY' : 'SEM';
    var safeName = esc(t.name);
    var safePri  = esc(t.priority||'week');
    var safeCat  = esc(t.category||'general');

    var metaHtml = '';
    if (!isDone) {
      // categoría chip
      if (t.category && t.category !== 'general') {
        var catLabels = {trabajo:'Trabajo',personal:'Personal',salud:'Salud',casa:'Casa',otro:'Otro'};
        metaHtml += '<span class="cat-chip '+safeCat+'">'+(catLabels[t.category]||t.category)+'</span>';
      }
      // tiempo estimado
      if (t.estimated_minutes) {
        metaHtml += '<span class="t-est">⏱ '+minsToHuman(t.estimated_minutes)+'</span>';
      }
      // deadline
      if (t.deadline) {
        metaHtml += '<span class="t-deadline">⚠ '+t.deadline+'</span>';
      }
    }

    var doneClass = isDone ? ' done' : '';
    var delCb = 'delTask('+t.id+',\''+safeName.replace(/'/g,"\\'")+ '\',\''+safePri+'\',\''+safeCat+'\')';

    return '<div class="task-row '+priClass+doneClass+'">' +
      '<div class="t-dot"></div>' +
      '<div class="t-content">' +
        '<div class="t-name">'+safeName+'</div>' +
        (metaHtml ? '<div class="t-meta">'+metaHtml+'</div>' : '') +
      '</div>' +
      (!isDone ? '<button class="pri-badge '+badgeCls+'" onclick="togglePriority('+t.id+',\''+safePri+'\')" title="Cambiar prioridad">'+badgeTxt+'</button>' : '') +
      '<div class="task-actions">' +
        (!isDone ? '<button class="t-btn check" onclick="completeTask('+t.id+')" title="Completar">'+checkIcon+'</button>' : '') +
        '<button class="t-btn del" onclick="'+delCb+'" title="Eliminar">'+trashIcon+'</button>' +
      '</div>' +
    '</div>';
  }

  if (pending.length) {
    h += '<div class="section-label">Pendientes</div>';
    pending.forEach(function(t){ h += renderTask(t, false); });
  }
  if (dones.length) {
    h += '<div class="section-label" style="margin-top:6px">Hechas</div>';
    dones.forEach(function(t){ h += renderTask(t, true); });
  }
  el.innerHTML = h;
}

// ════════════════════════════════════════
// CHECK-IN AL ABRIR
// ════════════════════════════════════════
async function doCheckin() {
  try {
    var r = await fetch('/api/checkin');
    var d = await r.json();
    // Quitar el loading
    var cl = document.getElementById('checkinLoading');
    if (cl) cl.remove();
    // Mostrar mensaje de check-in
    addMsg('ai', d.message, null, true);
    checkinDone = true;
  } catch(e) {
    var cl = document.getElementById('checkinLoading');
    if (cl) cl.remove();
    // Fallback: welcome estático
    var msgs = document.getElementById('messages');
    msgs.innerHTML = '<div class="welcome" id="welcome">' +
      '<div class="w-icon">N</div>' +
      '<h2>Hola, soy Nova</h2>' +
      '<p>Tu asistente personal. Agrega tareas en el panel o cuéntame qué tienes pendiente.</p>' +
      '<div class="sugs">' +
        '<div class="sug" onclick="sendSug(this)">¿Qué hago primero?</div>' +
        '<div class="sug" onclick="sendSug(this)">Ayúdame a priorizar</div>' +
        '<div class="sug" onclick="sendSug(this)">¿Cómo va mi día?</div>' +
        '<div class="sug" onclick="sendSug(this)">¿Cuánto me falta?</div>' +
      '</div></div>';
    checkinDone = true;
  }
}

// ════════════════════════════════════════
// CHAT
// ════════════════════════════════════════
function sendSug(el) {
  document.getElementById('msgInput').value = el.textContent;
  sendMessage();
}

async function sendMessage() {
  if (isLoading) return;
  var inp  = document.getElementById('msgInput');
  var text = inp.value.trim();
  if (!text) return;
  var w = document.getElementById('welcome'); if (w) w.remove();
  inp.value = ''; inp.style.height = 'auto';
  addMsg('user', text, null, false);
  hist.push({role:'user', content:text});
  showTyping();
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  try {
    var r = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages:hist})
    });
    var d = await r.json();
    removeTyping();
    addMsg('ai', d.message, d.action_result, false);
    hist.push({role:'assistant', content:d.message});
    if (d.tasks) updateUI(d.tasks, {pct:d.progress[2], done:d.progress[1], total:d.progress[0]}, d.today_load);
  } catch(e) {
    removeTyping();
    addMsg('ai', 'Error de conexión, intenta de nuevo.', null, false);
  }
  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}

function addMsg(role, text, action, isCheckin) {
  var c   = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'message ' + (role==='ai'||role==='checkin' ? 'ai' : 'user');
  var isAi = role==='ai' || role==='checkin';
  var bubbleClass = 'msg-bubble' + (isCheckin ? ' checkin-bubble' : '');
  div.innerHTML =
    '<div class="msg-av '+(isAi?'ai':'me')+'">'+(isAi?'N':'tú')+'</div>' +
    '<div class="msg-body">' +
      '<div class="msg-who">'+(isAi?'Nova':'Tú')+'</div>' +
      '<div class="'+bubbleClass+'">'+fmt(text)+'</div>' +
      (action ? '<div class="action-tag">⚡ '+esc(action)+'</div>' : '') +
    '</div>';
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}

function showTyping() {
  var c = document.getElementById('messages'), div = document.createElement('div');
  div.className = 'message ai'; div.id = 'typing';
  div.innerHTML = '<div class="msg-av ai">N</div><div class="msg-body"><div class="msg-who">Nova</div>' +
    '<div class="msg-bubble typing-dots"><div class="t-dot-a"></div><div class="t-dot-a"></div><div class="t-dot-a"></div></div></div>';
  c.appendChild(div); c.scrollTop = c.scrollHeight;
}
function removeTyping() { var t=document.getElementById('typing'); if(t) t.remove(); }

function fmt(t) {
  return esc(t)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`(.*?)`/g,'<code style="background:rgba(255,255,255,0.06);padding:1px 7px;border-radius:4px;font-family:JetBrains Mono,monospace;font-size:13px">$1</code>')
    .replace(/\n/g,'<br>');
}
function esc(t) {
  return String(t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════════════
// INPUT AUTO-RESIZE
// ════════════════════════════════════════
document.getElementById('msgInput').addEventListener('input', function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});
document.getElementById('msgInput').addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

// ════════════════════════════════════════
// BOOT
// ════════════════════════════════════════
loadTasks();
doCheckin();
</script>
</body>
</html>
