<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f10">
<title>Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f10;
    --surface:#18181b;
    --surface-2:#202024;
    --border:#2a2a2e;
    --border-strong:#3a3a40;
    --text:#f2f2f0;
    --text-dim:#a0a0a0;
    --text-faint:#6b6b70;
    --accent:#7c6cf5;
    --warn:#e0a12a;
    --warn-bg:rgba(224,161,42,.14);
    --danger:#e05a52;
    --success:#4caf7d;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Instrument Sans',system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    display:flex;
    justify-content:center;
    padding:0 16px;
  }
  #app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:28px 4px 40px;
  }

  /* Encabezado / saludo */
  header{margin-bottom:22px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-size:26px;font-weight:600;letter-spacing:-.5px;}
  .brand .fecha{font-size:13px;color:var(--text-faint);}
  .saludo{font-size:15px;color:var(--text-dim);margin-top:8px;line-height:1.45;}

  /* Caja de entrada */
  .caja{
    display:flex;align-items:center;gap:10px;
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:6px;
    transition:border-color .15s;
  }
  .caja:focus-within{border-color:var(--accent);}
  .caja i{color:var(--text-faint);font-size:18px;flex-shrink:0;}
  .caja input{
    flex:1;background:none;border:none;outline:none;
    color:var(--text);font-family:inherit;font-size:16px;
  }
  .caja input::placeholder{color:var(--text-faint);}
  .hint{font-size:12px;color:var(--text-faint);margin:0 4px 20px;}

  /* Lista */
  ul{list-style:none;}
  li{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--border);
    animation:fade .25s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .check{
    width:22px;height:22px;border-radius:7px;
    border:2px solid var(--border-strong);
    flex-shrink:0;margin-top:1px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .check:active{transform:scale(.9);}
  .check.on{background:var(--success);border-color:var(--success);}
  .check.on i{color:#0f0f10;font-size:14px;}
  .check i{opacity:0;font-size:14px;}
  .check.on i{opacity:1;}

  .body{flex:1;min-width:0;}
  .txt{font-size:16px;word-wrap:break-word;line-height:1.4;}
  li.done .txt{color:var(--text-faint);text-decoration:line-through;}
  .tag{
    display:inline-block;margin-top:5px;font-size:12px;
    padding:2px 9px;border-radius:7px;
    color:var(--text-dim);background:var(--surface-2);
  }
  .tag.urgent{color:var(--warn);background:var(--warn-bg);}
  .tag i{font-size:11px;vertical-align:-1px;margin-right:3px;}

  .del{
    color:var(--text-faint);background:none;border:none;
    cursor:pointer;font-size:18px;padding:2px 4px;flex-shrink:0;
    opacity:0;transition:opacity .15s,color .15s;
  }
  li:hover .del{opacity:1;}
  .del:hover{color:var(--danger);}

  /* Estado vacío */
  .empty{
    text-align:center;color:var(--text-faint);
    padding:48px 20px;font-size:15px;line-height:1.6;
  }
  .empty i{font-size:32px;display:block;margin-bottom:12px;opacity:.5;}

  /* Toast deshacer */
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--surface-2);border:1px solid var(--border-strong);
    border-radius:12px;padding:12px 16px;
    display:flex;align-items:center;gap:14px;
    font-size:14px;color:var(--text);
    transition:transform .25s ease;z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #toast.show{transform:translateX(-50%) translateY(0);}
  #toast button{
    background:none;border:none;color:var(--accent);
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }

  @media (min-width:441px){ .del{opacity:.4;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Nova</h1>
      <span class="fecha" id="fecha"></span>
    </div>
    <p class="saludo" id="saludo">Cargando…</p>
  </header>

  <div class="caja">
    <span style="font-size:18px;color:var(--text-faint);">+</span>
    <input id="input" type="text" placeholder="Escribe lo que sea…"
           autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
  </div>
  <p class="hint">Una línea y ya queda. Si escribes “mañana” o “el viernes”, le pongo fecha sola.</p>

  <ul id="lista"></ul>

  <div id="toast">
    <span id="toast-txt"></span>
    <button id="undo">Deshacer</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" rel="stylesheet" as="style" onload="this.rel='stylesheet'"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" rel="stylesheet">
<script>
const $ = s => document.querySelector(s);
const lista = $("#lista");
const input = $("#input");
let lastDeleted = null;
let toastTimer = null;

async function load(){
  const r = await fetch("/api/state");
  const data = await r.json();
  $("#fecha").textContent = data.greeting.fecha;
  $("#saludo").innerHTML = `<strong style="color:var(--text)">${data.greeting.saludo}</strong> ${data.greeting.linea}`;
  render(data.items);
}

function render(items){
  lista.innerHTML = "";
  if(!items.length){
    lista.innerHTML = `<div class="empty"><i class="ti ti-notes"></i>
      Aquí vive todo lo que traes en la cabeza.<br>Escribe arriba y suéltalo.</div>`;
    return;
  }
  for(const it of items) lista.appendChild(row(it));
}

function row(it){
  const li = document.createElement("li");
  li.className = it.done ? "done" : "";
  li.dataset.id = it.id;

  const check = document.createElement("div");
  check.className = "check" + (it.done ? " on" : "");
  check.innerHTML = '<i class="ti ti-check"></i>';
  check.onclick = () => toggle(it.id, li);

  const body = document.createElement("div");
  body.className = "body";
  const txt = document.createElement("div");
  txt.className = "txt";
  txt.textContent = it.text;
  body.appendChild(txt);

  if(it.due_label){
    const tag = document.createElement("span");
    tag.className = "tag" + (it.urgent ? " urgent" : "");
    tag.innerHTML = `<i class="ti ti-calendar"></i>${it.due_label}`;
    body.appendChild(tag);
  }

  const del = document.createElement("button");
  del.className = "del";
  del.innerHTML = '<i class="ti ti-x"></i>';
  del.onclick = () => removeItem(it, li);

  li.append(check, body, del);
  return li;
}

async function addItem(text){
  const r = await fetch("/api/add", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({text})
  });
  if(r.ok) load();
}

async function toggle(id, li){
  const check = li.querySelector(".check");
  const on = check.classList.toggle("on");
  li.classList.toggle("done", on);
  await fetch(`/api/toggle/${id}`, {method:"POST"});
  setTimeout(load, 400);
}

async function removeItem(it, li){
  li.remove();
  lastDeleted = it;
  await fetch(`/api/item/${it.id}`, {method:"DELETE"});
  showToast("Eliminado");
}

function showToast(msg){
  $("#toast-txt").textContent = msg;
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 4000);
}

$("#undo").onclick = async () => {
  if(!lastDeleted) return;
  await fetch("/api/add", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({text: lastDeleted.text})
  });
  lastDeleted = null;
  $("#toast").classList.remove("show");
  load();
};

input.addEventListener("keydown", e => {
  if(e.key === "Enter" && input.value.trim()){
    const v = input.value.trim();
    input.value = "";
    addItem(v);
  }
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
